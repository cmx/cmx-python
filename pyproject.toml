[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmx"
version = "0.0.47"
description = "REPL with Python Scripts via live documents - A documentation library for creating interactive markdown documentation from Python code"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ge Yang", email = "ge.ike.yang@gmail.com" }
]
keywords = ["documentation", "markdown", "jupyter", "notebooks", "live-documentation", "repl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

# The core is dependency-free: `import cmx` needs zero third-party packages.
# Feature surfaces (tables, images, figures, yaml, ...) pull their own extras.
dependencies = []

[project.urls]
Homepage = "https://github.com/cmx/cmx-python"
Documentation = "https://cmx-python.readthedocs.io"
Repository = "https://github.com/cmx/cmx-python"
Issues = "https://github.com/cmx/cmx-python/issues"

[project.optional-dependencies]
# Feature extras -- imported lazily, install only what you use.
# e.g. `pip install cmx[images]` or `pip install cmx[all]`.
# The default "github" table format is rendered by a pure-Python renderer
# (cmx.backends.md_table), so only pandas is needed at runtime. tabulate is
# required only for alternate `format=` values (pipe, grid, ...).
tables = ["pandas>=1.0.0"]
images = ["pillow>=8.0.0", "numpy>=1.18.0"]
figures = ["matplotlib>=3.0.0"]
yaml = ["pyyaml>=5.0.0"]
all = ["pandas>=1.0.0", "pillow>=8.0.0", "numpy>=1.18.0", "matplotlib>=3.0.0", "pyyaml>=5.0.0"]

# Development packages (floors, not exact pins, so they track current releases)
dev = [
    "black>=24.0",
    "pylint>=3.0",
    "pytest>=7.4",
    "pandas>=1.0.0",
    # tabulate is dev-only: the reference oracle for the md_table parity tests
    # (tests/test_md_table.py). It is NOT a runtime dependency.
    "tabulate>=0.8.0",
]

# Documentation packages (caps widened to admit current Sphinx/myst majors)
docs = [
    "sphinx>=7.1.2,<10",
    "furo",
    "myst-parser>=3.0,<6",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-design",
    "linkify-it-py>=2.0",
]

# Server packages (optional). NOTE: the Sanic server is an out-of-scope stub;
# the floor is modernised but the server itself is not test-verified.
server = [
    "sanic>=23.0",
    "killport",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cmx*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

# black
[tool.black]
line-length = 120

# pylint
[tool.pylint.messages_control]
max-line-length = 120
generated-members = ["numpy.*", "torch.*", "cv2.*", "cv.*"]
good-names-rgxs = "^[_a-zA-Z][_a-z0-9]?$"
ignore-paths = []
jobs = 0
ignored-classes = []

disable = [
    "duplicate-code",
    "fixme",
    "logging-fstring-interpolation",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-locals",
    "unnecessary-ellipsis",
]

#pytest
[tool.pytest.ini_options]
addopts = "--disable-warnings"
python_files = ["test_*.py"]
testpaths = ["tests"]

# pyright
[tool.pyright]
include = ["cmx"]
exclude = ["**/node_modules", "**/__pycache__", ]
ignore = ["cmx/viewer"]
defineConstant = { DEBUG = true }

reportMissingImports = true
reportMissingTypeStubs = false
reportPrivateImportUsage = false
reportUndefinedVariable = false

pythonVersion = "3.11"
pythonPlatform = "Linux"
