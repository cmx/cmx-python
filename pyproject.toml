[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmx"
version = "0.0.47"
description = "REPL with Python Scripts via live documents - A documentation library for creating interactive markdown documentation from Python code"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8.6"
authors = [
    { name = "Ge Yang", email = "ge.ike.yang@gmail.com" }
]
keywords = ["documentation", "markdown", "jupyter", "notebooks", "live-documentation", "repl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "waterbear>=2.6.0",
    "pandas>=1.0.0",
    "termcolor>=1.1.0",
    "pillow>=8.0.0",
    "matplotlib>=3.0.0",
    "tabulate>=0.8.0",
    "pyyaml>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/cmx/cmx-python"
Documentation = "https://cmx-python.readthedocs.io"
Repository = "https://github.com/cmx/cmx-python"
Issues = "https://github.com/cmx/cmx-python/issues"

[project.optional-dependencies]
# Development packages
dev = [
    "black==22.3.0",
    "pylint==2.13.4",
    "pytest==7.1.2",
]

# Documentation packages
docs = [
    "sphinx==7.1.2",
    "furo",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-design",
]

# Server packages (optional)
server = [
    "sanic==20.9.0",
    "killport",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cmx*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

# black
[tool.black]
line-length = 120

# pylint
[tool.pylint.messages_control]
max-line-length = 120
generated-members = ["numpy.*", "torch.*", "cv2.*", "cv.*"]
good-names-rgxs = "^[_a-zA-Z][_a-z0-9]?$"
ignore-paths = []
jobs = 0
ignored-classes = []

disable = [
    "duplicate-code",
    "fixme",
    "logging-fstring-interpolation",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-locals",
    "unnecessary-ellipsis",
]

#pytest
#[tool.pytest.ini_options]
#addopts = "-n=4 --typeguard-packages=cmx --disable-warnings"
#testpaths = [
#    "tests",
#]

# pyright
[tool.pyright]
include = ["cmx"]
exclude = ["**/node_modules", "**/__pycache__", ]
ignore = ["cmx/viewer"]
defineConstant = { DEBUG = true }

reportMissingImports = true
reportMissingTypeStubs = false
reportPrivateImportUsage = false
reportUndefinedVariable = false

pythonVersion = "3.8"
pythonPlatform = "Linux"
