# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Install cmx with the `docs` extra -- the single source of truth for the docs
# toolchain and runtime deps autodoc needs (defined in pyproject.toml).
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
